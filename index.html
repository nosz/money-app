<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>MoneyApp</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#f7f1e4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MoneyApp">
    <style>
        :root {
            --ink: #f7f1e4;
            --surface: #fff;
            --gold: #c98a2e;
            --sage: #8a9a4f;
            --rust: #c15a3f;
            --text: #3a2f22;
            --m: color-mix(in srgb, var(--text) 78%, var(--ink));
            --b: color-mix(in srgb, var(--text) 26%, var(--surface));
            --s2: color-mix(in srgb, var(--text) 7%, var(--surface));
            --fd: Georgia, 'Times New Roman', serif
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            margin: 0;
            background: var(--ink);
            color: var(--text);
            font: 1rem/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 140px
        }

        .w {
            max-width: 680px;
            margin: 0 auto;
            padding: calc(12px + env(safe-area-inset-top)) 14px 0
        }

        h2 {
            font: 1.5rem var(--fd);
            margin: .2rem 0 .7rem
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--b);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px
        }

        .big {
            font: 2.2rem var(--fd)
        }

        .m,
        small {
            color: var(--m)
        }

        small {
            font-size: .9rem
        }

        .pos {
            color: color-mix(in srgb, var(--sage) 70%, var(--text))
        }

        .neg {
            color: var(--rust)
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            min-height: 56px;
            border-bottom: 1px solid var(--b)
        }

        .row:last-child {
            border: 0
        }

        .g {
            flex: 1;
            min-width: 0
        }

        .ic {
            font-size: 1.4rem;
            width: 2rem;
            text-align: center
        }

        .mn {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px
        }

        .mn .g {
            text-align: center;
            font: 1.25rem var(--fd)
        }

        .mn .btn {
            min-width: 52px;
            font-size: 1.4rem
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--b);
            display: grid;
            grid-template-columns: 1fr 104px 1fr;
            align-items: center;
            padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
            z-index: 5
        }

        nav .nb {
            position: relative;
            background: none;
            border: 0;
            color: var(--m);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            border-radius: 16px;
            padding: 0;
            cursor: pointer
        }

        nav .nb.on {
            color: var(--gold);
            background: color-mix(in srgb, var(--gold) 14%, transparent)
        }

        nav .nb img {
            display: block;
            width: 32px;
            height: 32px;
            object-fit: contain;
            opacity: .7
        }

        nav .nb.on img {
            opacity: 1
        }

        #fab {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--gold);
            color: var(--on, #fff);
            border: 0;
            margin: -36px auto 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px #0006, 0 0 0 5px var(--surface);
            cursor: pointer
        }

        #fab:active {
            transform: scale(.94)
        }

        .btn {
            background: var(--gold);
            color: var(--on, #fff);
            min-height: 48px;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }

        .btn.s {
            background: var(--s2);
            color: var(--text);
            border: 1px solid var(--b)
        }

        .btn.d {
            background: var(--rust);
            color: #fff
        }

        .btn.sm {
            padding: 8px 12px;
            min-height: 44px;
            font-size: .95rem
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            min-height: 48px;
            border: 1px solid var(--b);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            margin: 4px 0
        }

        .ov {
            position: fixed;
            inset: 0;
            background: #0007;
            z-index: 9;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }

        .sh {
            background: var(--ink);
            width: 100%;
            max-width: 680px;
            max-height: 92%;
            max-height: calc(100dvh - env(safe-area-inset-top) - 24px);
            overscroll-behavior: contain;
            scroll-padding-top: 76px;
            overflow: auto;
            border-radius: 20px 20px 0 0;
            padding: 16px 14px calc(16px + env(safe-area-inset-bottom))
        }

        .seg {
            display: flex;
            gap: 8px
        }

        .seg button {
            flex: 1
        }

        .seg .pr {
            flex: 2
        }

        .tp {
            display: flex;
            gap: 4px;
            padding: 4px;
            margin: 4px 0 10px;
            background: var(--s2);
            border: 1px solid var(--b);
            border-radius: 14px
        }

        .tp button {
            flex: 1;
            min-height: 44px;
            padding: 8px 6px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: .95rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer
        }

        .tp button.on {
            background: var(--tc, var(--gold));
            color: var(--tcx, var(--on, #fff));
            box-shadow: 0 1px 3px #0003
        }

        .tp i {
            font-style: normal;
            font-weight: 800;
            margin-right: 2px
        }

        .tp .te {
            color: var(--rust)
        }

        .tp .ti {
            color: color-mix(in srgb, var(--sage) 70%, var(--text))
        }

        .tp .tu {
            color: var(--text)
        }

        .tp button.on i {
            color: inherit
        }

        .rh {
            margin: 14px 0 2px;
            font-weight: 700
        }

        .rh:first-child {
            margin-top: 0
        }

        .rh.e {
            color: var(--rust)
        }

        .rh.i {
            color: color-mix(in srgb, var(--sage) 70%, var(--text))
        }

        .row.re,
        .row.ri {
            padding-left: 10px
        }

        .row.re {
            box-shadow: inset 4px 0 0 var(--rust)
        }

        .row.ri {
            box-shadow: inset 4px 0 0 color-mix(in srgb, var(--sage) 70%, var(--text))
        }

        .hint {
            display: block;
            margin: 0 2px 8px;
            color: var(--m);
            line-height: 1.35
        }

        .sh[data-t] {
            border-top: 5px solid var(--tc);
            --tcx: #fff
        }

        .sh[data-t=e] {
            --tc: var(--rust)
        }

        .sh[data-t=i] {
            --tc: color-mix(in srgb, var(--sage) 70%, var(--text))
        }

        .sh[data-t=u] {
            --tc: var(--text);
            --tcx: var(--ink)
        }

        .sh[data-t] .amt {
            color: var(--tc)
        }

        .sh[data-t] .btn.pr {
            background: var(--tc);
            color: var(--tcx)
        }

        .grid button.on {
            border-color: var(--tc, var(--gold));
            background: color-mix(in srgb, var(--tc, var(--gold)) 14%, var(--surface))
        }

        .dir {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin: 6px 0 10px
        }

        .dir>div {
            flex: 1;
            min-width: 0
        }

        .dir label {
            margin-top: 0
        }

        .swp {
            flex: none;
            width: 44px;
            height: 48px;
            margin-bottom: 4px;
            border: 1px solid var(--b);
            border-radius: 10px;
            background: var(--s2);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 1fr;
            gap: 8px;
            margin: 12px 0;
            outline-offset: 6px;
            border-radius: 14px
        }

        .grid button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-height: 72px;
            padding: 8px 2px;
            background: var(--surface);
            border: 2px solid var(--b);
            border-radius: 14px;
            color: var(--text);
            font-family: inherit;
            font-size: .78rem;
            line-height: 1.15;
            text-align: center;
            overflow-wrap: break-word;
            hyphens: auto;
            -webkit-hyphens: auto;
            cursor: pointer
        }

        .grid button.on {
            border-color: var(--gold);
            background: color-mix(in srgb, var(--gold) 18%, var(--surface));
            font-weight: 700
        }

        .grid .nr {
            grid-column: 1 / -1;
            padding: 14px 0;
            text-align: center;
            color: var(--m)
        }

        .grid b {
            display: block;
            font-size: 1.5rem;
            line-height: 1
        }

        .grid span {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-width: 100%
        }

        .amt {
            font: 2.4rem var(--fd);
            text-align: center
        }

        .th {
            width: 46px;
            height: 46px;
            min-height: 0;
            border-radius: 50%;
            border: 3px solid var(--b);
            margin: 4px;
            padding: 0;
            cursor: pointer
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(120px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            background: var(--text);
            color: var(--ink);
            padding: 8px 8px 8px 16px;
            border-radius: 20px;
            z-index: 10;
            display: none;
            align-items: center;
            gap: 10px;
            white-space: nowrap
        }

        #toast button {
            background: none;
            border: 0;
            color: var(--gold);
            font: inherit;
            font-weight: 700;
            min-height: 40px;
            padding: 0 10px
        }

        summary {
            cursor: pointer;
            color: var(--m);
            margin: 0;
            padding: 10px 0
        }

        label {
            display: block;
            margin-top: 14px;
            color: var(--m);
            font-size: .95rem;
            font-weight: 600
        }

        #res summary {
            color: var(--text);
            margin: 2px 0 4px
        }

        #res details+details {
            margin-top: 12px
        }

        .mh summary {
            font: 1.1rem var(--fd);
            color: var(--text);
            margin: 0
        }

        .mh summary small {
            font: .9rem -apple-system, Roboto, sans-serif
        }

        .hd {
            padding: 8px 0 6px
        }

        .hd span {
            cursor: pointer;
            color: var(--m);
            font-size: .9rem;
            font-weight: 600;
            user-select: none
        }

        .dc {
            width: 3.6rem;
            flex: none;
            color: var(--m);
            font-size: .95rem
        }

        .tr b,
        .hd span:last-child {
            min-width: 5rem;
            text-align: right
        }

        .row[onclick] {
            cursor: pointer
        }

        .row[onclick]:active {
            background: var(--s2)
        }

        .row>b:last-child {
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        .sec {
            padding: 0;
            margin-bottom: 12px;
            scroll-margin-top: calc(8px + env(safe-area-inset-top))
        }

        .sec>button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: 0;
            color: var(--text);
            font: 1.15rem var(--fd);
            text-align: left;
            padding: 14px;
            min-height: 62px;
            cursor: pointer
        }

        .sec .chev {
            font: 1.9rem/1 var(--fd);
            color: var(--m);
            transition: transform .15s
        }

        .sec.open .chev {
            transform: rotate(90deg)
        }

        .sec.open>button {
            border-bottom: 1px solid var(--b)
        }

        .sb {
            padding: 6px 14px 16px
        }

        .sb .card {
            background: var(--s2);
            border-color: transparent
        }

        .sht {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--ink);
            margin: -16px -14px 10px;
            padding: 12px 14px
        }

        .sht h2 {
            margin: 0
        }

        .x {
            flex: none;
            width: 44px;
            height: 44px;
            min-height: 0;
            padding: 0;
            border-radius: 50%;
            border: 1px solid var(--b);
            background: var(--surface);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer
        }

        .btn.s.ghost {
            width: 100%;
            margin-top: 8px;
            background: none;
            border-color: transparent;
            color: var(--m)
        }

        input[type=checkbox] {
            width: 24px;
            height: 24px;
            min-height: 0;
            padding: 0;
            margin: 0 10px 0 0;
            vertical-align: middle;
            accent-color: var(--gold)
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        summary:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }
